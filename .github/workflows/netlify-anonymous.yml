name: One-time Netlify preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static preview
        run: |
          mkdir -p /tmp/storeroom-preview/assets
          cp index.html styles.css app.js /tmp/storeroom-preview/
          cp assets/mobao-logo.jpeg /tmp/storeroom-preview/assets/
      - name: Deploy public preview anonymously
        working-directory: /tmp/storeroom-preview
        run: npx --yes netlify-cli@latest deploy --prod --allow-anonymous --dir .
